<div class="chat-header">

  <!-- =========================================
       MOBILE BACK BUTTON
       MOBILE ONLY
  ========================================== -->

  <button
    type="button"
    class="mobile-back-btn"
    (click)="goBack()"
    aria-label="Back to messages">

    <i class="fa-solid fa-arrow-left"></i>

  </button>


  <!-- =========================================
       LEFT SIDE
  ========================================== -->

  <div class="left">

    <div class="avatar-wrapper">

      <img
        [src]="chat.avatar"
        class="avatar"
        [alt]="chat.name">

      <span
        class="header-status"
        *ngIf="chat.online">
      </span>

    </div>


    <div class="user-info">

      <h3>{{ chat.name }}</h3>

      <p>{{ chat.shop }}</p>

      <small
        class="online"
        *ngIf="chat.online">

        <span>●</span> Online

      </small>

      <small
        class="offline"
        *ngIf="!chat.online">

        Last seen recently

      </small>

    </div>

  </div>


  <!-- =========================================
       DESKTOP ACTIONS
       DESKTOP ONLY
  ========================================== -->

  <div class="desktop-actions">

    <!-- WhatsApp -->

    <button
      type="button"
      class="header-action whatsapp-action"
      title="WhatsApp"
      (click)="openWhatsApp()">

      <i class="fa-brands fa-whatsapp"></i>

    </button>


    <!-- Call -->

    <button
      type="button"
      class="header-action call-action"
      title="Call"
      (click)="makeCall()">

      <i class="fa-solid fa-phone"></i>

    </button>


    <!-- Email -->

    <button
      type="button"
      class="header-action mail-action"
      title="Email"
      (click)="sendEmail()">

      <i class="fa-solid fa-envelope"></i>

    </button>

  </div>


  <!-- =========================================
       MOBILE THREE DOT MENU
       MOBILE ONLY
  ========================================== -->

  <div class="mobile-menu-wrapper">

    <button
      type="button"
      class="mobile-more-btn"
      (click)="toggleMenu()"
      aria-label="More options">

      <i class="fa-solid fa-ellipsis-vertical"></i>

    </button>


    <!-- MOBILE DROPDOWN -->

    <div
      class="mobile-dropdown"
      *ngIf="showMenu">


      <!-- WhatsApp -->

      <button
        type="button"
        class="mobile-menu-item"
        (click)="openWhatsApp()">

        <i class="fa-brands fa-whatsapp whatsapp-icon"></i>

        <span>WhatsApp</span>

      </button>


      <!-- Call -->

      <button
        type="button"
        class="mobile-menu-item"
        (click)="makeCall()">

        <i class="fa-solid fa-phone call-icon"></i>

        <span>Call</span>

      </button>


      <!-- Email -->

      <button
        type="button"
        class="mobile-menu-item"
        (click)="sendEmail()">

        <i class="fa-solid fa-envelope email-icon"></i>

        <span>Email</span>

      </button>

    </div>

  </div>

</div>

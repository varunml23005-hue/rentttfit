<header class="site-header">

  <!-- =====================================================
       HEADER MAIN
  ====================================================== -->

  <div class="header-main">

    <!-- =================================================
         MOBILE HAMBURGER
    ================================================== -->

    <button
      class="mobile-menu-button"
      type="button"
      (click)="toggleMobileMenu()"
      aria-label="Open menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>


    <!-- =================================================
         LOGO
    ================================================== -->

    <button
      class="brand"
      type="button"
      (click)="goHome()"
    >

      <div class="hanger-logo">

        <svg
          viewBox="0 0 70 60"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="RentFits logo"
        >

          <!-- HANGER HOOK -->
          <path
            d="M35 5
               C35 2 39 1 41 4
               C43 7 40 10 37 12"
            fill="none"
            stroke="#ed3f70"
            stroke-width="2.2"
            stroke-linecap="round"
          />

          <!-- HANGER -->
          <path
            d="M37 12
               L64 34
               C66 36 65 40 61 40
               H9
               C5 40 4 36 7 34
               L35 12"
            fill="none"
            stroke="#ed3f70"
            stroke-width="2.2"
            stroke-linejoin="round"
            stroke-linecap="round"
          />

          <!-- CENTER LINE -->
          <path
            d="M35 12 V51"
            fill="none"
            stroke="#ed3f70"
            stroke-width="2"
            stroke-linecap="round"
          />

        </svg>

      </div>


      <div class="brand-text">

        <div class="brand-name">
          RentFits
        </div>

        <div class="brand-tagline">
          Wear More. Spend Less.
        </div>

      </div>

    </button>


    <!-- =================================================
         MOBILE HEADER ACTIONS
    ================================================== -->

    <div class="mobile-header-actions">

      <!-- WISHLIST -->

      <button
        class="mobile-header-icon wishlist-mobile"
        type="button"
        (click)="handleAction('Wishlist')"
        aria-label="Wishlist"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <path
            d="M20.8 8.7
               C20.8 13.5 12 19.2 12 19.2
               S3.2 13.5 3.2 8.7
               C3.2 5.8 5.2 4 7.7 4
               C9.3 4 10.8 4.8 12 6.2
               C13.2 4.8 14.7 4 16.3 4
               C18.8 4 20.8 5.8 20.8 8.7Z"
          />

        </svg>

      </button>


      <!-- CART -->

      <button
        class="mobile-header-icon cart-mobile"
        type="button"
        (click)="handleAction('Cart')"
        aria-label="Shopping cart"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <path
            d="M3 4H5L7.2 15.2
               C7.4 16.2 8.3 17 9.4 17H17.5
               C18.5 17 19.3 16.4 19.6 15.5L21 9H6"
          />

          <circle
            cx="9.5"
            cy="20"
            r="1.4"
          />

          <circle
            cx="17.5"
            cy="20"
            r="1.4"
          />

        </svg>


        <!-- CART BADGE -->

        <span class="mobile-cart-badge">
          2
        </span>

      </button>

    </div>


    <!-- =================================================
         SEARCH
    ================================================== -->

    <div class="search-container">

      <input
        type="text"
        placeholder="Search outfits, brands, jewellery..."
        [(ngModel)]="searchText"
        (keyup.enter)="search()"
      />

      <button
        class="search-button"
        type="button"
        (click)="search()"
        aria-label="Search"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <circle
            cx="10.8"
            cy="10.8"
            r="6.5"
          />

          <path
            d="M16 16L21 21"
          />

        </svg>

      </button>

    </div>


    <!-- =================================================
         DESKTOP HEADER ACTIONS
    ================================================== -->

    <div class="header-actions">

      <!-- BECOME A SELLER -->

      <button
        class="header-action"
        type="button"
        (click)="handleAction('Become a Seller')"
      >

        <div class="action-icon user-icon"></div>

        <span>
          Become a Seller
        </span>

      </button>


      <!-- MESSAGE -->

      <button
        class="header-action"
        type="button"
        (click)="goToMessages()"
      >

        <div class="action-icon message-icon"></div>

        <span>
          Message
        </span>

      </button>


      <!-- WISHLIST -->

      <button
        class="header-action"
        type="button"
        (click)="handleAction('Wishlist')"
      >

        <div class="action-icon heart-icon">
          ♡
        </div>

        <span>
          Wishlist
        </span>

      </button>


      <!-- LOCATION -->

      <div class="location-dropdown">

        <button
          class="header-action location-action"
          type="button"
          (click)="toggleLocationDropdown()"
        >

          <div class="action-icon location-icon">

            <span class="location-pin"></span>

          </div>

          <span>
            {{ selectedLocation }}
          </span>

        </button>


        @if (locationDropdownOpen) {

          <div class="location-menu">

            <div class="location-menu-title">
              Select Location
            </div>

            <button
              type="button"
              (click)="selectLocation('Mumbai')"
            >
              Mumbai
            </button>

            <button
              type="button"
              (click)="selectLocation('Delhi')"
            >
              Delhi
            </button>

            <button
              type="button"
              (click)="selectLocation('Bengaluru')"
            >
              Bengaluru
            </button>

            <button
              type="button"
              (click)="selectLocation('Hyderabad')"
            >
              Hyderabad
            </button>

            <button
              type="button"
              (click)="selectLocation('Chennai')"
            >
              Chennai
            </button>

            <button
              type="button"
              (click)="selectLocation('Kolkata')"
            >
              Kolkata
            </button>

            <button
              type="button"
              (click)="selectLocation('Pune')"
            >
              Pune
            </button>

            <button
              type="button"
              (click)="selectLocation('Jaipur')"
            >
              Jaipur
            </button>

          </div>

        }

      </div>


      <!-- CART -->

      <button
        class="header-action cart-action"
        type="button"
        (click)="handleAction('Cart')"
      >

        <div class="action-icon cart-icon"></div>

        <span class="cart-badge">
          2
        </span>

        <span>
          Cart
        </span>

      </button>


      <!-- SIGN IN -->

      <button
        class="header-action"
        type="button"
        (click)="handleAction('Sign in / Register')"
      >

        <div class="action-icon signin-icon"></div>

        <span>
          Sign in / Register
        </span>

      </button>

    </div>

  </div>


  <!-- =====================================================
       NAVIGATION
  ====================================================== -->

  <nav class="main-navigation">

    <button
      type="button"
      (click)="navigate('Women')"
    >
      Women
    </button>

    <button
      type="button"
      (click)="navigate('Men')"
    >
      Men
    </button>

    <button
      type="button"
      (click)="navigate('Kids')"
    >
      Kids
    </button>

    <button
      type="button"
      (click)="navigate('Jewellery')"
    >
      Jewellery
    </button>

    <button
      type="button"
      (click)="navigate('Occasions')"
    >
      Occasions
    </button>

    <button
      type="button"
      (click)="navigate('Brands')"
    >
      Brands
    </button>

    <button
      type="button"
      (click)="navigate('New Arrivals')"
    >
      New Arrivals
    </button>

    <button
      type="button"
      (click)="navigate('How It Works')"
    >
      How It Works
    </button>

  </nav>


  <!-- =====================================================
       MOBILE MENU
       ONLY:
       Become a Seller
       Location
       How It Works
       Message
       Sign in / Register
  ====================================================== -->

  @if (mobileMenuOpen) {

    <!-- DARK OVERLAY -->

    <div
      class="mobile-menu-overlay"
      (click)="toggleMobileMenu()"
    ></div>


    <!-- SIDE MENU -->

    <aside class="mobile-menu">

      <!-- MENU HEADER -->

      <div class="mobile-menu-header">

        <div class="mobile-menu-title">
          Menu
        </div>

        <button
          type="button"
          class="mobile-menu-close"
          (click)="toggleMobileMenu()"
          aria-label="Close menu"
        >
          ×
        </button>

      </div>


      <!-- ===============================================
           BECOME A SELLER
      ================================================ -->

      <button
        type="button"
        class="mobile-menu-item"
        (click)="handleAction('Become a Seller')"
      >

        <span class="mobile-menu-item-icon">
          👤
        </span>

        <span class="mobile-menu-item-text">
          Become a Seller
        </span>

        <span class="mobile-menu-arrow">
          ›
        </span>

      </button>


      <!-- ===============================================
           LOCATION
      ================================================ -->

      <div class="mobile-menu-location">

        <button
          type="button"
          class="mobile-menu-item"
          (click)="toggleLocationDropdown()"
        >

          <span class="mobile-menu-item-icon">
            📍
          </span>

          <span class="mobile-menu-item-content">

            <span class="mobile-menu-item-text">
              Location
            </span>

            <small>
              {{ selectedLocation }}
            </small>

          </span>

          <span class="mobile-menu-arrow">
            {{ locationDropdownOpen ? '⌃' : '›' }}
          </span>

        </button>


        @if (locationDropdownOpen) {

          <div class="mobile-location-menu">

            <button
              type="button"
              (click)="selectLocation('Mumbai')"
            >
              Mumbai
            </button>

            <button
              type="button"
              (click)="selectLocation('Delhi')"
            >
              Delhi
            </button>

            <button
              type="button"
              (click)="selectLocation('Bengaluru')"
            >
              Bengaluru
            </button>

            <button
              type="button"
              (click)="selectLocation('Hyderabad')"
            >
              Hyderabad
            </button>

            <button
              type="button"
              (click)="selectLocation('Chennai')"
            >
              Chennai
            </button>

            <button
              type="button"
              (click)="selectLocation('Kolkata')"
            >
              Kolkata
            </button>

            <button
              type="button"
              (click)="selectLocation('Pune')"
            >
              Pune
            </button>

            <button
              type="button"
              (click)="selectLocation('Jaipur')"
            >
              Jaipur
            </button>

          </div>

        }

      </div>


      <!-- ===============================================
           HOW IT WORKS
      ================================================ -->

      <button
        type="button"
        class="mobile-menu-item"
        (click)="navigate('How It Works')"
      >

        <span class="mobile-menu-item-icon">
          ❓
        </span>

        <span class="mobile-menu-item-text">
          How It Works
        </span>

        <span class="mobile-menu-arrow">
          ›
        </span>

      </button>


      <!-- ===============================================
           MESSAGE
      ================================================ -->

      <button
        type="button"
        class="mobile-menu-item"
        (click)="goToMessages()"
      >

        <span class="mobile-menu-item-icon">
          💬
        </span>

        <span class="mobile-menu-item-text">
          Message
        </span>

        <span class="mobile-menu-arrow">
          ›
        </span>

      </button>


      <!-- ===============================================
           SIGN IN / REGISTER
      ================================================ -->

      <button
        type="button"
        class="mobile-menu-item mobile-login-item"
        (click)="handleAction('Sign in / Register')"
      >

        <span class="mobile-menu-item-icon">
          🔐
        </span>

        <span class="mobile-menu-item-text">
          Sign in / Register
        </span>

        <span class="mobile-menu-arrow">
          ›
        </span>

      </button>

    </aside>

  }

</header>
